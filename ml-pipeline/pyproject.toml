[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-financial-wellness-forecast-ml"
version = "0.1.0"
description = "Leakage-safe dataset and exploratory workspace for Forecast residual modeling"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "nbconvert>=7.16,<8",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

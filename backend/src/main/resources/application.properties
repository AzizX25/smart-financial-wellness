spring.application.name=smart-financial-wellness-backend

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=false
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Core REST API for Smart Financial Wellness
info.app.version=@project.version@

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_financial_wellness}
spring.datasource.username=${DB_USERNAME:smart_financial_wellness}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=smart_financial_wellness
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.default-schema=smart_financial_wellness
spring.flyway.schemas=smart_financial_wellness
spring.flyway.create-schemas=true
spring.flyway.validate-migration-naming=true

server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true

# Bounded, in-memory CSV uploads; original files are not retained.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.file-size-threshold=2MB

app.security.jwt.secret=${AUTH_JWT_SECRET:}
app.security.jwt.issuer=${AUTH_JWT_ISSUER:smart-financial-wellness-backend}
app.security.jwt.audience=${AUTH_JWT_AUDIENCE:smart-financial-wellness-frontend}
app.security.jwt.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:15m}
app.security.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:30d}
app.security.email-verification-token-ttl=${AUTH_EMAIL_VERIFICATION_TOKEN_TTL:24h}
app.security.email-verification-resend-cooldown=${AUTH_EMAIL_VERIFICATION_RESEND_COOLDOWN:30s}
app.security.password-reset-token-ttl=${AUTH_PASSWORD_RESET_TOKEN_TTL:30m}
app.security.password-reset-request-cooldown=${AUTH_PASSWORD_RESET_REQUEST_COOLDOWN:30s}
app.security.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
app.security.bcrypt-strength=${AUTH_BCRYPT_STRENGTH:12}
app.security.cors-allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}

app.email.sender-address=${EMAIL_SENDER_ADDRESS:no-reply@smart-financial-wellness.local}
app.email.sender-name=${EMAIL_SENDER_NAME:Mon Equilibre}
app.email.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

app.integrations.mock-bank.base-url=${MOCK_BANK_BASE_URL:http://localhost:8081}
app.integrations.mock-bank.connect-timeout=${MOCK_BANK_CONNECT_TIMEOUT:2s}
app.integrations.mock-bank.read-timeout=${MOCK_BANK_READ_TIMEOUT:5s}

app.integrations.ai-forecast.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
app.integrations.ai-forecast.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:2s}
app.integrations.ai-forecast.read-timeout=${AI_SERVICE_READ_TIMEOUT:5s}
app.integrations.ai-forecast.expected-model-id=${AI_FORECAST_EXPECTED_MODEL_ID:forecast-huber-synthetic-tnd}
app.integrations.ai-forecast.expected-model-version=${AI_FORECAST_EXPECTED_MODEL_VERSION:1.0.0}
app.integrations.ai-forecast.expected-feature-version=${AI_FORECAST_EXPECTED_FEATURE_VERSION:forecast-residual-features-v1}

app.integrations.ai-merchant.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
app.integrations.ai-merchant.connect-timeout=${AI_MERCHANT_CONNECT_TIMEOUT:2s}
app.integrations.ai-merchant.read-timeout=${AI_MERCHANT_READ_TIMEOUT:90s}
app.integrations.ai-merchant.expected-model-id=${AI_MERCHANT_EXPECTED_MODEL_ID:merchant-recognition-synthetic-v1}
app.integrations.ai-merchant.expected-model-version=${AI_MERCHANT_EXPECTED_MODEL_VERSION:1.0.0}
app.integrations.ai-merchant.expected-feature-version=${AI_MERCHANT_EXPECTED_FEATURE_VERSION:merchant-recognition-features-v1}
app.integrations.ai-merchant.expected-enrichment-provider-id=${AI_MERCHANT_EXPECTED_ENRICHMENT_PROVIDER_ID:ollama}
app.integrations.ai-merchant.expected-enrichment-model-id=${AI_MERCHANT_EXPECTED_ENRICHMENT_MODEL_ID:qwen3:4b}
app.integrations.ai-merchant.expected-enrichment-model-version=${AI_MERCHANT_EXPECTED_ENRICHMENT_MODEL_VERSION:ollama-api-v1}
app.integrations.ai-merchant.expected-enrichment-feature-version=${AI_MERCHANT_EXPECTED_ENRICHMENT_FEATURE_VERSION:merchant-enrichment-features-v1}
app.integrations.ai-merchant.expected-catalog-version=${AI_MERCHANT_EXPECTED_CATALOG_VERSION:merchant-catalog-v1}
app.integrations.ai-merchant.expected-taxonomy-version=${AI_MERCHANT_EXPECTED_TAXONOMY_VERSION:system-taxonomy-v2}

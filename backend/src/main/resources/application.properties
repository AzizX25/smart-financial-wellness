spring.application.name=smart-financial-wellness-backend

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Core REST API for Smart Financial Wellness
info.app.version=@project.version@

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_financial_wellness}
spring.datasource.username=${DB_USERNAME:smart_financial_wellness}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=smart_financial_wellness
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.default-schema=smart_financial_wellness
spring.flyway.schemas=smart_financial_wellness
spring.flyway.create-schemas=true
spring.flyway.validate-migration-naming=true

server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true

app.security.jwt.secret=${AUTH_JWT_SECRET:}
app.security.jwt.issuer=${AUTH_JWT_ISSUER:smart-financial-wellness-backend}
app.security.jwt.audience=${AUTH_JWT_AUDIENCE:smart-financial-wellness-frontend}
app.security.jwt.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:15m}
app.security.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:30d}
app.security.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
app.security.bcrypt-strength=${AUTH_BCRYPT_STRENGTH:12}
app.security.cors-allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

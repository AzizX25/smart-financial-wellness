<text x="30" y="1772" font-size="18" fill="#123458" font-weight="600" text-anchor="start">Relations et protocoles (numéros sur les flèches)</text>
<text x="30" y="1802" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">1. Backend principal → FastAPI et contrats : Appelle les routes d&#x27;inférence internes</text>
<text x="30" y="1867" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">2. FastAPI et contrats → Résidu Forecast : /forecast/predict-residual</text>
<text x="30" y="1932" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">3. FastAPI et contrats → Reconnaissance marchande : /merchant-recognition/predict</text>
<text x="30" y="1997" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">4. FastAPI et contrats → Explication et vision : /recommendations/explain ;</text>
<text x="30" y="2014" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">/receipts/extract</text>
<text x="30" y="2062" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">5. Résidu Forecast → Artefacts locaux : Charge le Huber et vérifie son empreinte</text>
<text x="700.0" y="1802" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">6. Reconnaissance marchande → Artefacts locaux : Charge catalogue et modèle marchand</text>
<text x="700.0" y="1867" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">7. Reconnaissance marchande → Enrichissement et admission : Recours optionnel après</text>
<text x="700.0" y="1884" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">modèle local (pointillés)</text>
<text x="700.0" y="1932" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">8. Enrichissement et admission → Ollama du poste : Embedding et raisonnement local</text>
<text x="700.0" y="1949" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">bornés (pointillés)</text>
<text x="700.0" y="1997" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">9. Enrichissement et admission → Ollama Web Search : Recherche marchande si activée</text>
<text x="700.0" y="2014" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">(pointillés)</text>
<text x="700.0" y="2062" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">10. Explication et vision → Ollama du poste : Explication ou vision si activée</text>
<text x="700.0" y="2079" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">(pointillés)</text>
<text x="30" y="2137" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Aucun PostgreSQL ni stockage de tickets. Les appels externes appartiennent uniquement à l&#x27;enrichissement marchand.</text>
<text x="30" y="2159" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Contrats et provenance sont validés avant toute suggestion ; le backend reste responsable de la persistance PENDING.</text>
<text x="30" y="2181" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Le slot d&#x27;inférence couvre embeddings, raisonnement et assistance. Forecast et health restent indépendants.</text>
</g>
</svg>

<text x="30" y="1852" font-size="18" fill="#123458" font-weight="600" text-anchor="start">Relations et protocoles (numéros sur les flèches)</text>
<text x="30" y="1882" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">1. Navigateur principal → frontend : HTTP : assets React</text>
<text x="30" y="1947" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">2. Navigateur administrateur → mock-bank-ui : HTTP : assets console</text>
<text x="30" y="2012" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">3. Navigateur principal → backend : REST / JWT via port hôte configuré</text>
<text x="30" y="2077" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">4. Navigateur administrateur → mock-bank : REST / JWT admin via :8081</text>
<text x="30" y="2142" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">5. backend → postgres : JDBC interne postgres:5432</text>
<text x="30" y="2207" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">6. mock-bank → mock-bank-db : JDBC interne mock-bank-db:5432</text>
<text x="870.0" y="1882" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">7. backend → mock-bank : HTTP interne mock-bank:8081</text>
<text x="870.0" y="1947" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">8. backend → ai-service : HTTP interne ai-service:8000</text>
<text x="870.0" y="2012" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">9. backend → mailpit : SMTP interne mailpit:1025</text>
<text x="870.0" y="2077" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">10. ai-service → Ollama sur le poste : HTTP via host-gateway (pointillés)</text>
<text x="870.0" y="2142" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">11. ai-service → Recherche web Ollama : HTTPS pour enrichissement marchand (pointillés)</text>
<text x="870.0" y="2207" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">12. Pipeline hors ligne → ai-service : Artefacts exportés puis copiés au build (pointillés)</text>
<text x="30" y="2282" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Les connexions navigateur vers le backend utilisent une URL publique ; les noms de service Compose sont réservés aux appels entre conteneurs.</text>
<text x="30" y="2304" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Les ports sont les valeurs de Compose, configurables par environnement. :8082 est le port backend observé pendant cette session.</text>
<text x="30" y="2326" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Les deux volumes PostgreSQL sont distincts. Les healthchecks et depends_on n&#x27;impliquent pas une disponibilité garantie des fonctionnalités IA.</text>
</g>
</svg>

<text x="30" y="1082" font-size="18" fill="#123458" font-weight="600" text-anchor="start">Relations et protocoles (numéros sur les flèches)</text>
<text x="30" y="1112" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">1. Utilisateur → Smart Financial Wellness : Utilise les fonctionnalités authentifiées</text>
<text x="30" y="1177" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">2. Développeur / stagiaire → Smart Financial Wellness : Publie des artefacts validés</text>
<text x="30" y="1194" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">hors ligne (pointillés)</text>
<text x="30" y="1242" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">3. Administrateur démo → Banque simulée : Utilise la console d&#x27;administration</text>
<text x="30" y="1307" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">4. Smart Financial Wellness → Banque simulée : Authentification bancaire et lectures</text>
<text x="30" y="1324" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">REST</text>
<text x="700.0" y="1112" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">5. Smart Financial Wellness → Messagerie locale : Emails après commit / SMTP</text>
<text x="700.0" y="1177" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">6. Smart Financial Wellness → Inférence locale : Inférence locale optionnelle / HTTP</text>
<text x="700.0" y="1194" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">(pointillés)</text>
<text x="700.0" y="1242" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">7. Smart Financial Wellness → Recherche web Ollama : Recherche publique optionnelle de</text>
<text x="700.0" y="1259" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">marchands / HTTPS (pointillés)</text>
<text x="30" y="1382" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">La banque est synthétique : aucune connexion à une banque réelle n&#x27;est démontrée.</text>
<text x="30" y="1404" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">La recherche web est réservée à l&#x27;enrichissement marchand. Les explications et tickets restent locaux.</text>
<text x="30" y="1426" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Le score et les recommandations sont déterministes ; l&#x27;IA ne choisit ni leur valeur ni leur priorité.</text>

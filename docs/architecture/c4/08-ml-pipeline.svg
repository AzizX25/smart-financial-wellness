<text x="30" y="1412" font-size="18" fill="#123458" font-weight="600" text-anchor="start">Relations et protocoles (numéros sur les flèches)</text>
<text x="30" y="1442" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">1. Développeur / stagiaire → Génération et validation : Exécute génération avec seed</text>
<text x="30" y="1507" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">2. Génération et validation → Dataset et features : Transactions synthétiques validées</text>
<text x="30" y="1572" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">3. Dataset et features → Expériences et évaluation : Exemples agrégés / features</text>
<text x="30" y="1589" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">versionnées</text>
<text x="30" y="1637" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">4. Dataset et features → Données et rapports locaux : Écrit dataset local</text>
<text x="30" y="1702" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">5. Expériences et évaluation → Données et rapports locaux : Écrit métriques et</text>
<text x="30" y="1719" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">provenance</text>
<text x="700.0" y="1442" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">6. Expériences et évaluation → Export contrôlé des modèles : Sélection validée et export</text>
<text x="700.0" y="1459" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">explicite</text>
<text x="700.0" y="1507" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">7. Catalogue marchand → Entraînement marchand : Exemples et taxonomie versionnés</text>
<text x="700.0" y="1572" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">8. Entraînement marchand → Export contrôlé des modèles : Artefact marchand validé</text>
<text x="700.0" y="1637" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">9. Export contrôlé des modèles → Artefacts d&#x27;inférence figés : Export avec empreintes /</text>
<text x="700.0" y="1654" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">inclusion build (pointillés)</text>
<text x="30" y="1777" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Le Huber Forecast est un prototype entraîné sur du synthétique TND ; il prédit le résidu du flux restant, pas directement un solde.</text>
<text x="30" y="1799" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Pas d&#x27;accès automatique à PostgreSQL ; données préparées hors ligne et séparation entraînement / inférence.</text>
<text x="30" y="1821" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">L&#x27;export n&#x27;est pas un déploiement continu. Aucun réentraînement n&#x27;est lancé par une requête utilisateur.</text>
</g>
</svg>

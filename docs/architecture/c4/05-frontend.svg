<text x="30" y="1412" font-size="18" fill="#123458" font-weight="600" text-anchor="start">Relations et protocoles (numéros sur les flèches)</text>
<text x="30" y="1442" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">1. Utilisateur → Routes et AppShell : Navigation et actions explicites</text>
<text x="30" y="1507" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">2. Routes et AppShell → Session et onboarding : Vérifie la session</text>
<text x="30" y="1572" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">3. Routes et AppShell → Pages financières : Affiche les pages autorisées</text>
<text x="30" y="1637" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">4. Pages financières → Composants de présentation : Réutilise les primitives et</text>
<text x="30" y="1654" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">représentations</text>
<text x="30" y="1702" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">5. Pages financières → Données et invalidation : Consomme et invalide les données</text>
<text x="30" y="1767" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">6. Session et onboarding → Client HTTP authentifié : Authentification et refresh</text>
<text x="700.0" y="1442" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">7. Pages financières → Client HTTP authentifié : Services API par fonctionnalité</text>
<text x="700.0" y="1507" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">8. Import et revue de ticket → Client HTTP authentifié : Prévisualisation CSV et</text>
<text x="700.0" y="1524" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">extraction de ticket</text>
<text x="700.0" y="1572" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">9. Import et revue de ticket → Pages financières : CSV vérifié à importer séparément</text>
<text x="700.0" y="1637" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">10. Données et invalidation → Client HTTP authentifié : Comptes, agrégations et</text>
<text x="700.0" y="1654" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">transactions</text>
<text x="700.0" y="1702" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">11. Client HTTP authentifié → API principale : REST + JWT / cookie HttpOnly</text>
<text x="30" y="1842" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Pas d&#x27;appel navigateur vers :8081, FastAPI, Ollama ou une base de données.</text>
<text x="30" y="1864" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Le graphique Forecast relie le solde daté à la prévision de fin de mois ; il n&#x27;invente pas des prédictions quotidiennes.</text>
<text x="30" y="1886" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">La console mock-bank-ui est une autre SPA, avec une session et une API d&#x27;administration séparées.</text>
</g>

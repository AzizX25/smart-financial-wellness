<text x="30" y="1412" font-size="18" fill="#123458" font-weight="600" text-anchor="start">Relations et protocoles (numéros sur les flèches)</text>
<text x="30" y="1442" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">1. Backend principal → Sécurité JWT et ownership : Login client puis lectures JWT</text>
<text x="30" y="1507" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">2. Console administrateur → Sécurité JWT et ownership : REST / JWT admin ; CORS :5174</text>
<text x="30" y="1572" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">3. Sécurité JWT et ownership → Authentification fournisseur : Authentifie le client</text>
<text x="30" y="1589" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">synthétique</text>
<text x="30" y="1637" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">4. Sécurité JWT et ownership → Comptes / soldes / opérations : Autorise les lectures</text>
<text x="30" y="1654" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">client-scoped</text>
<text x="30" y="1702" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">5. Sécurité JWT et ownership → Administration synthétique : Autorise les opérations</text>
<text x="30" y="1719" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">administrateur</text>
<text x="700.0" y="1442" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">6. Comptes / soldes / opérations → Lookup et repositories : Vérifie le compte et son</text>
<text x="700.0" y="1459" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">propriétaire</text>
<text x="700.0" y="1507" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">7. Authentification fournisseur → Lookup et repositories : Charge le client et son hash</text>
<text x="700.0" y="1524" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">BCrypt</text>
<text x="700.0" y="1572" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">8. Administration synthétique → Lookup et repositories : Lit / modifie le ledger</text>
<text x="700.0" y="1589" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">synthétique</text>
<text x="700.0" y="1637" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">9. Fixture superviseur → Lookup et repositories : Réconcilie uniquement les fixtures</text>
<text x="700.0" y="1654" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">démo</text>
<text x="700.0" y="1702" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">10. Lookup et repositories → PostgreSQL mock_bank : JPA ; transactions et migrations</text>
<text x="700.0" y="1719" font-size="13" fill="#17324d" font-weight="400" text-anchor="start">propres</text>
<text x="30" y="1777" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Pas de flux OAuth Authorization Code / PKCE exécutable ; les tables de conception ne sont pas une API implémentée.</text>
<text x="30" y="1799" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">Un compte d&#x27;un autre client retourne 404 Account not found ; les entités JPA ne sont pas exposées.</text>
<text x="30" y="1821" font-size="13" fill="#59616d" font-weight="400" text-anchor="start">La fixture nécessite le profil demo, un flag activé et une authentification administrateur.</text>
</g>
</svg>

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_financial_wellness}
      POSTGRES_USER: ${DB_USERNAME:-smart_financial_wellness}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  mock-bank-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MOCK_BANK_DB_NAME:-mock_bank}
      POSTGRES_USER: ${MOCK_BANK_DB_USERNAME:-mock_bank}
      POSTGRES_PASSWORD: ${MOCK_BANK_DB_PASSWORD:?MOCK_BANK_DB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mock-bank-data:/var/lib/postgresql/data

  mock-bank:
    build:
      context: ./mock-bank
    depends_on:
      mock-bank-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://mock-bank-db:5432/${MOCK_BANK_DB_NAME:-mock_bank}
      DB_USERNAME: ${MOCK_BANK_DB_USERNAME:-mock_bank}
      DB_PASSWORD: ${MOCK_BANK_DB_PASSWORD:?MOCK_BANK_DB_PASSWORD must be set}
    ports:
      - "${MOCK_BANK_PORT:-8081}:8081"

volumes:
  postgres-data:
  mock-bank-data:

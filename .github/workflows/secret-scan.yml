name: Secret checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output scanner.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' | sha256sum --check
          tar -xzf scanner.tar.gz
      - name: Scan current source without disclosing secret values
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir . --config .gitleaks.toml --redact=100 --no-banner'
      - name: Check private setup, blank templates and local-only ports
        shell: pwsh
        run: |
          ./scripts/setup/test_local_environment.ps1
          ./scripts/setup/test_legacy_demo_administrator.ps1

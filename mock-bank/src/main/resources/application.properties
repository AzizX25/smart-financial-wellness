spring.application.name=mock-bank

server.port=8081

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Development-only simulated banking provider
info.app.version=@project.version@

app.security.jwt.secret=${MOCK_BANK_JWT_SECRET:}
app.security.jwt.issuer=${MOCK_BANK_JWT_ISSUER:smart-financial-wellness-mock-bank}
app.security.jwt.audience=${MOCK_BANK_JWT_AUDIENCE:smart-financial-wellness-backend}
app.security.jwt.access-token-ttl=${MOCK_BANK_ACCESS_TOKEN_TTL:10m}
app.security.jwt.admin-access-token-ttl=${MOCK_BANK_ADMIN_ACCESS_TOKEN_TTL:15m}
app.security.bcrypt-strength=${MOCK_BANK_BCRYPT_STRENGTH:12}
app.security.admin-ui-origin=${MOCK_BANK_ADMIN_UI_ORIGIN:http://localhost:5174}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mock_bank}
spring.datasource.username=${DB_USERNAME:mock_bank}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=mock_bank
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.default-schema=mock_bank
spring.flyway.schemas=mock_bank
spring.flyway.create-schemas=true
spring.flyway.validate-migration-naming=true

spring.sql.init.mode=never

server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

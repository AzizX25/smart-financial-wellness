spring.application.name=mock-bank

server.port=8081

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mock_bank}
spring.datasource.username=${DB_USERNAME:mock_bank}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=mock_bank
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.default-schema=mock_bank
spring.flyway.schemas=mock_bank
spring.flyway.create-schemas=true
spring.flyway.validate-migration-naming=true

spring.sql.init.mode=never

server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
